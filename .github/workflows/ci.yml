name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Los tests usan Dev Services (PostgreSQL y Redis en Docker); el runner ya trae Docker.
      - run: ./mvnw -B verify
