# ------------------------------------------------------------------------------
# Propias de la aplicación (las leerás con un @ConfigMapping(prefix = "mto")).
# Los maestros reales NO van al repo: se leen de la carpeta MTO_DATA_DIR.
#   MTO_DATA_DIR=/ruta/a/mto-configuration/data ./mvnw quarkus:dev
# ------------------------------------------------------------------------------
mto:
  data-dir: ${MTO_DATA_DIR:}
  lov-file: lov-master.xlsx
  profile-file: profile-master.xlsx
  load-on-startup: true
  stream-page-size: 500

quarkus:
  http:
    port: 8090
    test-port: 0

  # --- Base de datos -----------------------------------------------------------
  # En dev y test no hace falta nada: Dev Services levanta PostgreSQL en Docker y
  # configura los dos accesos (el reactivo para la aplicación y el JDBC para Flyway).
  datasource:
    db-kind: postgresql

  flyway:
    migrate-at-start: true

  hibernate-orm:
    # El esquema es de Flyway (src/main/resources/db/migration); Hibernate solo lo comprueba.
    schema-management:
      strategy: validate
    # Nombres en snake_case: sortOrder -> sort_order.
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  # --- Caché (fase 2) ------------------------------------------------------------
  # Dev Services levanta Redis. Cada @CacheResult(cacheName = "...") guarda en Redis, con claves
  # "mto-explorer:<caché>:<clave>". Los nombres y de qué maestro depende cada caché: CacheNames.
  cache:
    type: redis
    redis:
      # {cache-name} es obligatorio: sin él, todas las cachés comparten claves en Redis (las que no
      # tienen parámetros, la misma: "default-cache-key") y una lee los datos de otra.
      prefix: mto-explorer:{cache-name}
      # Se vacían al importar (CacheInvalidator). Esto es la red de seguridad: si algo cambiara la
      # base de datos por otro camino, una entrada no duraría más de un día.
      expire-after-write: 24H

  # --- gRPC (fase 3) -------------------------------------------------------------
  # El servidor gRPC comparte el puerto HTTP (8090) en vez de abrir el 9000: gRPC va sobre HTTP/2, y
  # el servidor HTTP de Quarkus (Vert.x) lo entiende.
  grpc:
    server:
      use-separate-server: false
      # Que grpcurl y la Dev UI puedan preguntar qué servicios hay (en dev ya viene encendido).
      enable-reflection-service: true
    # Un cliente con nombre: @GrpcClient("infrastructure"). En los tests Quarkus cambia el puerto
    # por el del servidor de test.
    clients:
      infrastructure:
        host: localhost
        port: 8090

  # --- LangChain4j (fase 5) ------------------------------------------------------
  # Apagado hasta la fase 5: si no, Dev Services descargaría un modelo de varios GB al arrancar.
  langchain4j:
    devservices:
      enabled: false
    ollama:
      devservices:
        enabled: false

  # --- OpenAPI -------------------------------------------------------------------
  smallrye-openapi:
    info-title: mto-explorer
  swagger-ui:
    always-include: true

# --- Producción ------------------------------------------------------------------
"%prod":
  quarkus:
    datasource:
      username: ${DB_USER:mto_explorer}
      password: ${DB_PASSWORD:mto_explorer}
      reactive:
        url: ${DB_REACTIVE_URL:postgresql://localhost:5432/mto_explorer}
      jdbc:
        url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/mto_explorer}
    redis:
      hosts: ${REDIS_URL:redis://localhost:6379}
